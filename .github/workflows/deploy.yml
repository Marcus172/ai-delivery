name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run pdf
      # Fails (exit 2) when the NDA_DENYLIST secret is empty, so nothing deploys ungated.
      - run: npm run nda
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
      - run: npm run test:unit
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
      - run: npm run test:postbuild
      - run: npm run test:e2e
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
